triggers:
  - id: "TRG-01"
    name: "Red Sea Maritime Vessel Diversion"
    category: "Ocean Logistics"
    metric: "shipping_delay_days"
    green_condition: "<= 5"
    amber_condition: "> 5 and <= 12"
    red_condition: "> 12"
    owner: "Logistics & MMD"
    playbook_action: "ACT-06"
    mitigation_sop: "Reroute shipments via Cape of Good Hope; secure 45-day rolling slot bookings with primary container carriers [SAMPLE DATA] to prevent port dwell time."

  - id: "TRG-02"
    name: "Copper Spot Price Spike (LME Cathode)"
    category: "Commodity Price"
    metric: "copper_shock_pct"
    green_condition: "<= 10"
    amber_condition: "> 10 and <= 25"
    red_condition: "> 25"
    owner: "MMD Procurement"
    playbook_action: "ACT-01"
    mitigation_sop: "Lock 60% of next quarter requirements via forward contracts; review domestic wire-rod draw alternatives."

  - id: "TRG-03"
    name: "Aluminium Smelter Disruption (Middle East)"
    category: "Commodity Price"
    metric: "aluminium_shock_pct"
    green_condition: "<= 10"
    amber_condition: "> 10 and <= 20"
    red_condition: "> 20"
    owner: "MMD & Castings Plant"
    playbook_action: "ACT-03"
    mitigation_sop: "Qualify domestic secondary aluminium smelters (domestic secondary smelters [SAMPLE DATA]) to bypass Gulf import lanes."

  - id: "TRG-04"
    name: "Container Freight Rate Surge"
    category: "Ocean Freight"
    metric: "freight_multiplier"
    green_condition: "<= 1.4"
    amber_condition: "> 1.4 and <= 2.2"
    red_condition: "> 2.2"
    owner: "Logistics"
    playbook_action: "ACT-07"
    mitigation_sop: "Enforce 25.5t dense container loading (target 98% payload) and consolidate European LCL orders into FCL."

  - id: "TRG-05"
    name: "OEM Working Capital Cash Lag Drag"
    category: "Finance & Treasury"
    metric: "working_capital_gap_cr"
    green_condition: "<= 8.0"
    amber_condition: "> 8.0 and <= 16.0"
    red_condition: "> 16.0"
    owner: "Finance & Commercial"
    playbook_action: "ACT-02"
    mitigation_sop: "Trigger indexation provisions in supply agreements [TEAM ASSUMPTION]: demand monthly index-settlement and reduce recovery lag from 75d to 30d."

  - id: "TRG-06"
    name: "Plant Buffer Depletion / Stock-out Risk"
    category: "Plant Operations"
    metric: "worst_days_of_cover"
    green_condition: "> 35"
    amber_condition: "<= 35 and > 20"
    red_condition: "<= 20"
    owner: "Production & MMD"
    playbook_action: "ACT-04"
    mitigation_sop: "Activate strategic safety stock replenishment and re-sequence assembly lines to prevent shift shutdown."

  - id: "TRG-07"
    name: "Currency Devaluation (INR vs USD)"
    category: "Foreign Exchange"
    metric: "fx_inr_usd"
    green_condition: "<= 87.0"
    amber_condition: "> 87.0 and <= 92.0"
    red_condition: "> 92.0"
    owner: "Treasury"
    playbook_action: "ACT-01"
    mitigation_sop: "Deploy dynamic USD/INR options collars with bank consortium treasury desks [SAMPLE DATA] to cap import landed-cost depreciation."
