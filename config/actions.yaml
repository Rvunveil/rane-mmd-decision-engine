actions:
  - id: "ACT-01"
    title: "Commodity Hedge / Forward-Buy Metals"
    category: "Financial / Procurement"
    description: "Lock in forward contracts for 60% of next quarter's copper and aluminium requirements to cap upside spot surges."
    time_to_implement: "1 - 2 weeks"
    cash_budget_required_cr: 15.0
    formula_cost: "0.015 * delta_material if delta_material > 0 else 1.2" # option premium & hedging fee
    formula_benefit: "0.45 * delta_material if delta_material > 0 else 0.0" # locks in 45% of material delta
    function_impacts:
      MMD:
        status: "+"
        reason: "Insulates procurement from volatile LME spot spikes."
      Finance:
        status: "+"
        reason: "Smoothes cash flow and protects gross margins; reduces P&L variance."
      Production:
        status: "neutral"
        reason: "No direct change to shop floor line planning."
      Quality:
        status: "neutral"
        reason: "Supplied material adheres to existing Tier-1 metallurgical specs."
      Logistics:
        status: "neutral"
        reason: "Contract shipping schedule remains standard."
      Sales:
        status: "+"
        reason: "Enables stable quarterly pricing quotes to OEMs."
    affected_suppliers: ["CODELCO / Enami (Chile)", "EGA / Alba (Middle East)"]

  - id: "ACT-02"
    title: "Index-Linked OEM Formula Contract Renegotiation"
    category: "Commercial / Sales"
    description: "Renegotiate OEM pricing to link contract pass-through directly to ICEMA/LME monthly indices and reduce recovery lag from 75 to 30 days."
    time_to_implement: "4 - 8 weeks"
    cash_budget_required_cr: 2.0
    formula_cost: "2.0" # Legal and commercial negotiation allowance
    formula_benefit: "0.25 * (delta_material + delta_freight) + (active_scenario.pass_through_lag_days - 30) / 365 * (delta_material + delta_freight) * 0.095"
    function_impacts:
      MMD:
        status: "+"
        reason: "Eliminates need for emergency price justification meetings with OEMs."
      Finance:
        status: "+"
        reason: "Accelerates cash conversion cycle; eliminates ₹15-20 Cr unrecovered working capital."
      Production:
        status: "neutral"
        reason: "Lines continue unaffected."
      Quality:
        status: "neutral"
        reason: "Product specs unchanged."
      Logistics:
        status: "neutral"
        reason: "Freight absorption passes directly to customer."
      Sales:
        status: "-"
        reason: "Demands tough negotiations with OEM purchasing heads (Maruti, Tata, Hyundai)."
    affected_suppliers: ["All Tier-1 OEM Customers (Maruti Suzuki, Tata Motors, M&M, Ashok Leyland)"]

  - id: "ACT-03"
    title: "Dual-Sourcing & Domestic Substitution (Near-Shoring)"
    category: "Strategic Sourcing"
    description: "Qualify domestic secondary aluminium smelters (Hindalco/Vedanta) and local resin compounders to reduce import exposure."
    time_to_implement: "6 - 10 weeks"
    cash_budget_required_cr: 8.5
    formula_cost: "5.5 + 0.02 * base_material_spend" # Tooling qualification & PPAP validation
    formula_benefit: "0.30 * delta_freight + 0.15 * delta_material if delta_material > 0 else 3.5"
    function_impacts:
      MMD:
        status: "+"
        reason: "Shrinks lead time from 40+ days maritime to 5 days domestic transit."
      Finance:
        status: "+"
        reason: "Cuts ocean freight spending and FX exposure."
      Production:
        status: "+"
        reason: "High delivery frequency prevents buffer depletion."
      Quality:
        status: "-"
        reason: "Requires urgent PPAP Level-3 approvals and chemistry re-testing."
      Logistics:
        status: "+"
        reason: "Eliminates container demurrage and vessel booking volatility."
      Sales:
        status: "+"
        reason: "Higher domestic value-add improves PLI scheme compliance."
    affected_suppliers: ["Hindalco Industries", "Vedanta Aluminium", "Supreme Petrochem"]

  - id: "ACT-04"
    title: "Strategic Safety Stock Elevation (Buffer Buffer)"
    category: "Inventory Policy"
    description: "Temporarily boost safety stock coverage on imported copper and resin from 15 to 30 days during acute geopolitical tension."
    time_to_implement: "1 - 3 weeks"
    cash_budget_required_cr: 22.0
    formula_cost: "0.095 * 18.0" # Working capital carrying cost on ₹18 Cr extra inventory
    formula_benefit: "6.5 + (0.5 * active_scenario.shipping_delay_days if active_scenario.shipping_delay_days > 5 else 0.0)" # Avoided line stoppage penalty
    function_impacts:
      MMD:
        status: "+"
        reason: "Zero panic spot-buying when vessel delays spike to 20+ days."
      Finance:
        status: "-"
        reason: "Ties up ₹18-22 Cr in working capital inventory holding."
      Production:
        status: "+"
        reason: "Eliminates risk of line starvation and unplanned shift shutdowns."
      Quality:
        status: "neutral"
        reason: "Standard inspection protocols preserved."
      Logistics:
        status: "-"
        reason: "Warehouse yard congestion at Chennai and Sanand plants."
      Sales:
        status: "+"
        reason: "100% On-Time Delivery (OTIF) maintained."
    affected_suppliers: ["Chilean Copper Importers", "East Asian Resin Suppliers"]

  - id: "ACT-05"
    title: "Air-Freight Bridge for Critical Stock-Out Avoidance"
    category: "Emergency Logistics"
    description: "Fly 15 tonnes of high-precision valve nickel alloy from Europe via air cargo to prevent line-shutdown penalties."
    time_to_implement: "3 - 5 days"
    cash_budget_required_cr: 4.8
    formula_cost: "4.8" # Premium air freight charter cost ($4.50/kg)
    formula_benefit: "12.5 if active_scenario.shipping_delay_days > 12 else (0.8 * active_scenario.shipping_delay_days)" # Avoided OEM late penalty & line halt
    function_impacts:
      MMD:
        status: "-"
        reason: "Exorbitant freight rate budget overrun."
      Finance:
        status: "-"
        reason: "Immediate unrecoverable cash drain of ₹4.8 Cr."
      Production:
        status: "+"
        reason: "Saves 3 engine valve assembly lines from 48-hour standstill."
      Quality:
        status: "-"
        reason: "Rushed receiving inspection under severe time pressure."
      Logistics:
        status: "+"
        reason: "Fast-track customs clearance at Chennai Air Cargo."
      Sales:
        status: "+"
        reason: "Protects critical relationship with key European automotive customer."
    affected_suppliers: ["Aubert & Duval (France)", "VDM Metals (Germany)"]

  - id: "ACT-06"
    title: "Cape of Good Hope Rerouting & Early Slot Booking"
    category: "Ocean Logistics"
    description: "Bypass Red Sea/Suez chokepoints by contracting direct Cape of Good Hope routes with 45-day guaranteed vessel space allocations."
    time_to_implement: "2 weeks"
    cash_budget_required_cr: 3.5
    formula_cost: "1.8 + 0.10 * delta_freight"
    formula_benefit: "0.40 * delta_freight + 4.0 if active_scenario.shipping_delay_days > 10 else 1.5"
    function_impacts:
      MMD:
        status: "+"
        reason: "Predictable ETAs restore stability to production planning."
      Finance:
        status: "neutral"
        reason: "Avoids exorbitant war risk insurance surcharges in Red Sea."
      Production:
        status: "+"
        reason: "Smooth material flow without sudden bunching."
      Quality:
        status: "neutral"
        reason: "Standard packaging protects cargo during extra 14 days transit."
      Logistics:
        status: "+"
        reason: "Guaranteed container slots avoid cargo roll-over at hub ports."
      Sales:
        status: "+"
        reason: "Provides credible revised schedules to OEM dispatch planners."
    affected_suppliers: ["Maersk Line", "Mediterranean Shipping Company (MSC)"]

  - id: "ACT-07"
    title: "Container Consolidation & Payload Maximisation"
    category: "Logistics Optimization"
    description: "Re-engineer container packing patterns and combine LCL shipments into dense 25.5t FCL containers to achieve 98% payload utilisation."
    time_to_implement: "2 - 4 weeks"
    cash_budget_required_cr: 1.2
    formula_cost: "1.2" # Pallet reconfiguration and dunnage testing
    formula_benefit: "0.18 * baseline_freight_cr * active_scenario.freight_multiplier"
    function_impacts:
      MMD:
        status: "+"
        reason: "Reduces overall container volume requirements by 18%."
      Finance:
        status: "+"
        reason: "Direct recurring freight saving per tonne landed."
      Production:
        status: "neutral"
        reason: "Material delivered in ready-to-line modular pallets."
      Quality:
        status: "+"
        reason: "Improved bracing eliminates transit damage and vibration wear."
      Logistics:
        status: "+"
        reason: "Fewer container handlings reduce port terminal dues and demurrage."
      Sales:
        status: "neutral"
        reason: "Internal operational enhancement."
    affected_suppliers: ["Global Freight Forwarders (Kuehne+Nagel, DHL Global Forwarding)"]

  - id: "ACT-08"
    title: "Engineering Material Substitution (Alternate Resins/Alloys)"
    category: "R&D / Value Engineering"
    description: "Deploy Rane R&D validated low-nickel stainless steel and composite phenolic friction grades with Tier-1 OEM sign-off."
    time_to_implement: "12 - 16 weeks"
    cash_budget_required_cr: 7.0
    formula_cost: "4.5" # Dyno testing, homologation, OEM validation trials
    formula_benefit: "0.08 * base_material_spend + 0.12 * delta_material if delta_material > 0 else 8.0"
    function_impacts:
      MMD:
        status: "+"
        reason: "Permanent structural reduction in expensive alloying elements."
      Finance:
        status: "+"
        reason: "Permanent EBITDA margin expansion of 40-60 bps."
      Production:
        status: "neutral"
        reason: "Minor adjustment to tool wear and sintering cycles."
      Quality:
        status: "+"
        reason: "Thorough rigorous re-validation guarantees safety compliance."
      Logistics:
        status: "neutral"
        reason: "Standard shipment parameters."
      Sales:
        status: "+"
        reason: "Offers competitive cost-down sharing to OEM clients."
    affected_suppliers: ["Internal Rane TRW / Rane Brake Lining R&D", "Specialty Resin Compounders"]

  - id: "ACT-09"
    title: "Production Dynamic Re-Sequencing & Overtime Control"
    category: "Operations Management"
    description: "Dynamically re-sequence plant schedules to prioritize models with high inventory cover, eliminating erratic overtime shifts."
    time_to_implement: "3 - 5 days"
    cash_budget_required_cr: 1.5
    formula_cost: "1.5" # Planning software reconfiguration & shift changeover allowances
    formula_benefit: "3.8 + (0.25 * active_scenario.shipping_delay_days if active_scenario.shipping_delay_days > 5 else 0.0)"
    function_impacts:
      MMD:
        status: "+"
        reason: "Syncs procurement consumption with actual plant throughput."
      Finance:
        status: "+"
        reason: "Saves ₹2.5-4.0 Cr in premium weekend overtime and idle operator wages."
      Production:
        status: "+"
        reason: "Steady takt times reduce operator fatigue and scrap generation."
      Quality:
        status: "+"
        reason: "Eliminates rushed changeovers; lowers defect parts-per-million (PPM)."
      Logistics:
        status: "neutral"
        reason: "Warehouse outflow aligns smoothly with OEM delivery windows."
      Sales:
        status: "-"
        reason: "Requires temporary delivery re-scheduling on secondary product lines."
    affected_suppliers: ["Plant Operations (Puducherry, Sanand, Pantnagar, Queretaro)"]

  - id: "ACT-10"
    title: "Do Nothing (Unmitigated Spot Exposure Reference)"
    category: "Baseline Reference"
    description: "Absorb full market spot prices, pay spot freight surcharges, and accept delayed customer shipments."
    time_to_implement: "Immediate"
    cash_budget_required_cr: 0.0
    formula_cost: "0.0"
    formula_benefit: "0.0"
    function_impacts:
      MMD:
        status: "-"
        reason: "Complete exposure to supplier spot price increases."
      Finance:
        status: "-"
        reason: "Unmitigated P&L erosion exceeding ₹60 Cr under severe shock."
      Production:
        status: "-"
        reason: "Acute stock-out risk leading to emergency line stoppages."
      Quality:
        status: "-"
        reason: "Emergency material bought under distress without thorough audit."
      Logistics:
        status: "-"
        reason: "Vessel roll-overs and high port demurrage penalties."
      Sales:
        status: "-"
        reason: "Severe customer demerits and liquidated damages for late delivery."
    affected_suppliers: ["All Spot Market Traders"]
